# Entorno de desarrollo: solo Postgres. El despliegue en el VPS se define en la fase 8.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: psst
      POSTGRES_PASSWORD: psst
      POSTGRES_DB: psst
    ports:
      - "5433:5432"  # 5433 en el host para no chocar con otros Postgres locales
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psst"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
