name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los tipos de la API (schema.d.ts) tienen que corresponder al openapi.json commiteado.
      - run: pnpm --filter @psst/web gen:types
      - run: git diff --exit-code apps/web/src/lib/api/schema.d.ts
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm build:web

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: psst
          POSTGRES_PASSWORD: psst
          POSTGRES_DB: psst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psst"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PSST_DATABASE_URL: postgresql+asyncpg://psst:psst@localhost:5432/psst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
      # El openapi.json commiteado en la web tiene que corresponder a la API actual.
      - run: uv run python -m scripts.export_openapi ../web/src/lib/api/openapi.json
      - run: git diff --exit-code ../web/src/lib/api/openapi.json
