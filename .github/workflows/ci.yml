name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los tipos de la API (schema.d.ts) tienen que corresponder al openapi.json commiteado.
      - run: pnpm --filter @psst/web gen:types
      - run: git diff --exit-code apps/web/src/lib/api/schema.d.ts
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build:web

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: psst
          POSTGRES_PASSWORD: psst
          POSTGRES_DB: psst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psst"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PSST_DATABASE_URL: postgresql+asyncpg://psst:psst@localhost:5432/psst
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install uv==0.9.30
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
      # El openapi.json commiteado en la web tiene que corresponder a la API actual.
      - run: uv run python -m scripts.export_openapi ../web/src/lib/api/openapi.json
      - run: git diff --exit-code ../web/src/lib/api/openapi.json
