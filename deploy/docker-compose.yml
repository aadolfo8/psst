# Producción en el VPS: Caddy (HTTPS + web + proxy), la API y Postgres.
# Uso, desde esta carpeta: crear .env (ver "Despliegue" en el README) y docker compose up -d --build
name: psst

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      PSST_DOMAIN: ${PSST_DOMAIN}
    volumes:
      - caddy_data:/data # certificados: si se pierden, Caddy los vuelve a pedir
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: ../apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      PSST_DATABASE_URL: postgresql+asyncpg://psst:${POSTGRES_PASSWORD}@db:5432/psst
      PSST_WEB_ORIGIN: https://${PSST_DOMAIN}
      PSST_COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: psst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: psst
    # Sin puertos publicados: solo la API llega a la base de datos.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psst"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  pgdata:
